name: ci
on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.17"
          enable-cache: true
      - run: uv python install
      - run: make sync
      - run: make check
      # eval gate (mocked judge) is added once eval/ has a gold set: uv run receipts eval --mock --gate

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.17"
          enable-cache: true
      - run: uv python install
      - name: Build wheel and source distribution
        run: make build
      - name: Install and smoke-test both distributions outside the checkout
        shell: bash
        run: |
          uv python find > "$RUNNER_TEMP/receipts-python"
          for artifact in dist/*.whl dist/*.tar.gz; do
            artifact="$GITHUB_WORKSPACE/$artifact"
            smoke_env="$RUNNER_TEMP/receipts-$(basename "$artifact")"
            uv venv --python "$(cat "$RUNNER_TEMP/receipts-python")" "$smoke_env"
            uv pip install --python "$smoke_env/bin/python" "$artifact"
            (cd "$RUNNER_TEMP" && "$smoke_env/bin/receipts" --help)
          done

  bench-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build bench environment
        run: docker build --tag receipts-bench:ci .
      - name: Smoke-test CLI and non-root workspace without network access
        run: |
          docker run --rm --network none receipts-bench:ci
          docker run --rm --network none receipts-bench:ci python -c \
            'import os, pathlib, pytest, receipts; assert os.getuid() != 0; pathlib.Path("probe").write_text("ok"); assert pathlib.Path("/app/bench/scenarios/piped-runner.yaml").is_file()'
