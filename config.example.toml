# Copy to ~/.custos-code/config.toml. Nothing here is secret; keys come from the environment.
[judge]
backend = "openai"            # "openai" | "anthropic"  (NEEDS-DECISION(oliver): confirm default per sponsor strategy)
openai_extractor_model = ""   # NEEDS-DECISION(oliver): smallest current model with structured outputs; check price list
openai_judge_model = ""       # NEEDS-DECISION(oliver): current reasoning model; check price list
anthropic_extractor_model = "claude-haiku-4-5"
anthropic_judge_model = "claude-opus-5"
temperature = 0.0
samples = 3                   # majority vote before any judge verdict is shown

[tiers]
rerun_enabled = true          # Tier 3 on by default for test/build claims
rerun_timeout_s = 60
# manual mode: nothing blocks, all marks shown. auto mode: loop until clean.
auto = false
auto_max_passes = 3           # 0 = run until clean (not recommended; see DESIGN §6)
auto_clear = ["contradicted", "unrecorded", "unwitnessed"]   # marks that must be resolved or withdrawn before the report is shown

[ledger]
max_output_bytes = 4096       # beyond this: truncate, keep full-content hash, flag truncated
redact = true

[upload]
enabled = false               # local by default; do not change without docs/privacy.md

[compress]
enabled = false                # off by default: judge-window-only pre-processor (Token Company bear-2).
                                # CUSTOS_CODE_TTC_API_KEY alone is not enough to turn this on -- it changes
                                # what evidence the judge sees, so it needs an explicit yes here too.
model = "bear-2"

# Price list for cost.py's dollar accounting ($ per 1M tokens). One [prices.<model-id>] table per
# model; `asof` dates the entry so a stale price is visible instead of silently wrong. Structure is
# decided (NEEDS-DECISION(anush) in cost.py resolved: lives here, dated per entry); the figures below
# are placeholders, not researched prices -- check the live price list before the cost slide
# (docs/OPEN_QUESTIONS.md research gaps).
[prices."gpt-5.2"]
asof = "2026-09-19"
input_per_1m = 0.0             # NEEDS-DECISION(anush): confirm against the OpenAI price list
cached_input_per_1m = 0.0
output_per_1m = 0.0

[prices."claude-opus-5"]
asof = "2026-09-19"
input_per_1m = 0.0             # NEEDS-DECISION(anush): confirm against the Anthropic price list
cached_input_per_1m = 0.0
output_per_1m = 0.0

[prices."bear-2"]
asof = "2026-09-19"
input_per_1m = 0.05            # Token Company's listed rate; one flat rate, no cached/output tiers
cached_input_per_1m = 0.0
output_per_1m = 0.0
